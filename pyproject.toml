[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "curriculum-knowledge-graph"
version = "0.1.0"
description = "Typed, provenance-aware curriculum knowledge graph for prerequisite reasoning, alignment diagnostics, path analysis, and curriculum review."
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Devis Wawan Saputra"}]
readme = "README.md"
keywords = [
  "curriculum",
  "knowledge-graph",
  "curriculum-mapping",
  "instructional-design",
  "learning-outcomes",
  "competency-mapping",
  "prerequisite-graph",
  "education",
  "python",
]

[project.urls]
Repository = "https://github.com/devissaputra/curriculum_knowledge_graph"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
