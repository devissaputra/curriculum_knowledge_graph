<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">Curriculum Knowledge Graph data and reasoning flow</title>
<desc id="desc">Typed curriculum records with provenance are validated against relation semantics, loaded into a graph, queried for prerequisite paths and alignment, and summarized as curriculum review diagnostics.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#52656D"/></marker></defs>
<rect width="100%" height="100%" fill="#FAFBFA"/>
<text x="60" y="64" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1B2430">Curriculum Knowledge Graph · data and reasoning flow</text>
<text x="60" y="98" font-family="Arial, sans-serif" font-size="17" fill="#5B6660">Every relation is an inspectable curriculum claim with type constraints and provenance.</text>

<rect x="55" y="145" width="230" height="140" rx="18" fill="#E8F1F3" stroke="#87949A" stroke-width="2"/>
<text x="170" y="180" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1B2430">Entity records</text>
<text x="170" y="207" text-anchor="middle" font-family="Arial" font-size="14" fill="#26343B">program · course · module</text>
<text x="170" y="228" text-anchor="middle" font-family="Arial" font-size="14" fill="#26343B">concept · outcome · competency</text>
<text x="170" y="249" text-anchor="middle" font-family="Arial" font-size="14" fill="#26343B">assessment · resource</text>

<line x1="290" y1="215" x2="345" y2="215" stroke="#52656D" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="360" y="145" width="230" height="140" rx="18" fill="#EEF3E8" stroke="#87949A" stroke-width="2"/>
<text x="475" y="180" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1B2430">Relation validation</text>
<text x="475" y="207" text-anchor="middle" font-family="Arial" font-size="14" fill="#26343B">allowed source → target types</text>
<text x="475" y="228" text-anchor="middle" font-family="Arial" font-size="14" fill="#26343B">confidence · evidence · date</text>
<text x="475" y="249" text-anchor="middle" font-family="Arial" font-size="14" fill="#26343B">duplicates · missing entities</text>

<line x1="595" y1="215" x2="650" y2="215" stroke="#52656D" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="665" y="145" width="230" height="140" rx="18" fill="#F5EDE4" stroke="#87949A" stroke-width="2"/>
<text x="780" y="180" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1B2430">Graph reasoning</text>
<text x="780" y="207" text-anchor="middle" font-family="Arial" font-size="14" fill="#26343B">prerequisites · ancestors</text>
<text x="780" y="228" text-anchor="middle" font-family="Arial" font-size="14" fill="#26343B">shortest / multiple paths</text>
<text x="780" y="249" text-anchor="middle" font-family="Arial" font-size="14" fill="#26343B">cycles · components</text>

<line x1="900" y1="215" x2="945" y2="215" stroke="#52656D" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="960" y="125" width="190" height="180" rx="18" fill="#ECE8F5" stroke="#87949A" stroke-width="2"/>
<text x="1055" y="160" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1B2430">Curriculum review</text>
<text x="1055" y="188" text-anchor="middle" font-family="Arial" font-size="14" fill="#26343B">alignment gaps</text>
<text x="1055" y="209" text-anchor="middle" font-family="Arial" font-size="14" fill="#26343B">coverage summary</text>
<text x="1055" y="230" text-anchor="middle" font-family="Arial" font-size="14" fill="#26343B">bottlenecks</text>
<text x="1055" y="251" text-anchor="middle" font-family="Arial" font-size="14" fill="#26343B">assessment load</text>
<text x="1055" y="272" text-anchor="middle" font-family="Arial" font-size="14" fill="#26343B">orphans</text>

<rect x="55" y="345" width="1095" height="72" rx="16" fill="#FFF7EC" stroke="#D4B27C"/>
<text x="75" y="374" font-family="Arial" font-size="15" font-weight="700" fill="#6F5427">Interpretation boundary</text>
<text x="75" y="398" font-family="Arial" font-size="14" fill="#6F5427">A missing or overloaded relation is a review prompt. Expert evidence is still needed to decide whether the curriculum itself should change.</text>
</svg>