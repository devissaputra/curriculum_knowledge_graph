on</text><text x="552" y="410" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">Merge aliases and map to canonical</text><text x="552" y="432" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">curriculum entities</text><rect x="525" y="461" width="480" height="105" rx="15" fill="#fff" stroke="#bfd0e2" stroke-width="2"/><rect x="525" y="461" width="11" height="105" rx="5" fill="#f07a28"/><text x="552" y="494" font-size="21" font-family="Arial" font-weight="700" fill="#12345b">Relation inference</text><text x="552" y="528" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">Prerequisite, teaches, assesses,</text><text x="552" y="550" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">aligns-with, depends-on</text><rect x="525" y="579" width="480" height="105" rx="15" fill="#fff" stroke="#bfd0e2" stroke-width="2"/><rect x="525" y="579" width="11" height="105" rx="5" fill="#7354b5"/><text x="552" y="612" font-size="21" font-family="Arial" font-weight="700" fill="#12345b">Graph reasoning</text><text x="552" y="646" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">Coverage, redundancy, prerequisite paths,</text><text x="552" y="668" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">and alignment queries</text><rect x="525" y="697" width="480" height="105" rx="15" fill="#fff" stroke="#bfd0e2" stroke-width="2"/><rect x="525" y="697" width="11" height="105" rx="5" fill="#3f9458"/><text x="552" y="730" font-size="21" font-family="Arial" font-weight="700" fill="#12345b">Embedding / GNN layer</text><text x="552" y="764" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">Support link prediction and semantic</text><text x="552" y="786" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">similarity analyses</text><rect x="1105" y="225" width="415" height="115" rx="15" fill="#fff" stroke="#bfd0e2" stroke-width="2"/><rect x="1105" y="225" width=