<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc">
<title id="title">Curriculum Knowledge Graph evaluation checklist</title>
<desc id="desc">Evaluation checklist for relation validity, expert agreement, path validity, diagnostic usefulness, version sensitivity, and interoperability.</desc>
<rect width="100%" height="100%" fill="#FAFBFA"/>
<text x="60" y="64" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1B2430">Curriculum Knowledge Graph · evaluation checklist</text>
<text x="60" y="99" font-family="Arial, sans-serif" font-size="17" fill="#5B6660">Structural correctness is necessary, but pedagogical validity still requires curriculum evidence and expert review.</text>

<rect x="60" y="140" width="330" height="130" rx="18" fill="#E8F1F3" stroke="#87949A"/>
<text x="82" y="174" font-family="Arial" font-size="17" font-weight="700" fill="#1B2430">Relation validity</text>
<text x="82" y="203" font-family="Arial" font-size="14" fill="#26343B">Do experts confirm relation type,</text>
<text x="82" y="225" font-family="Arial" font-size="14" fill="#26343B">direction, and supporting evidence?</text>

<rect x="435" y="140" width="330" height="130" rx="18" fill="#EEF3E8" stroke="#87949A"/>
<text x="457" y="174" font-family="Arial" font-size="17" font-weight="700" fill="#1B2430">Expert agreement</text>
<text x="457" y="203" font-family="Arial" font-size="14" fill="#26343B">Where do reviewers disagree about</text>
<text x="457" y="225" font-family="Arial" font-size="14" fill="#26343B">prerequisites and alignment?</text>

<rect x="810" y="140" width="330" height="130" rx="18" fill="#F5EDE4" stroke="#87949A"/>
<text x="832" y="174" font-family="Arial" font-size="17" font-weight="700" fill="#1B2430">Path validity</text>
<text x="832" y="203" font-family="Arial" font-size="14" fill="#26343B">Are graph paths educationally</text>
<text x="832" y="225" font-family="Arial" font-size="14" fill="#26343B">sensible rather than merely connected?</text>

<rect x="60" y="305" width="330" height="130" rx="18" fill="#ECE8F5" stroke="#87949A"/>
<text x="82" y="339" font-family="Arial" font-size="17" font-weight="700" fill="#1B2430">Diagnostic usefulness</text>
<text x="82" y="368" font-family="Arial" font-size="14" fill="#26343B">Do gaps, cycles, bottlenecks, and</text>
<text x="82" y="390" font-family="Arial" font-size="14" fill="#26343B">load flags improve curriculum review?</text>

<rect x="435" y="305" width="330" height="130" rx="18" fill="#F4EFE8" stroke="#87949A"/>
<text x="457" y="339" font-family="Arial" font-size="17" font-weight="700" fill="#1B2430">Version sensitivity</text>
<text x="457" y="368" font-family="Arial" font-size="14" fill="#26343B">Do findings change appropriately when</text>
<text x="457" y="390" font-family="Arial" font-size="14" fill="#26343B">the curriculum itself is revised?</text>

<rect x="810" y="305" width="330" height="130" rx="18" fill="#EAF0EC" stroke="#87949A"/>
<text x="832" y="339" font-family="Arial" font-size="17" font-weight="700" fill="#1B2430">Interoperability</text>
<text x="832" y="368" font-family="Arial" font-size="14" fill="#26343B">Can identifiers and alignments map to</text>
<text x="832" y="390" font-family="Arial" font-size="14" fill="#26343B">standards such as CASE without loss?</text>

<text x="60" y="488" font-family="Arial" font-size="15" fill="#5B6660">A clean graph is not the same as a good curriculum; evaluation must test the meaning and usefulness of the encoded relationships.</text>
</svg>